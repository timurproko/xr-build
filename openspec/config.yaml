schema: spec-driven

context: |
  This repo is the public XR Build core. Never use a proprietary name (a vendor, a vendor product or SDK, a client,
  a person, or where code came from) in any artifact: proposals, designs, specs, tasks, examples or scenario data.
  Describe roles instead ("a 3D display", "a hand tracker", "a station platform", "the platform's packager") and use
  made-up example names (`stereo-panel`, `tracker`, `station`). Plugins and projects live in the user's workspace,
  outside this repo; plan them there, not here. `pnpm check:names` must pass on every change.
