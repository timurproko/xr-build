name: Governance drift

# Compares the live repository settings, rulesets and labels with config/github-repository-governance.json (the App's
# administration: read) and keeps one issue labelled `governance-drift` open while they differ. Applying the file is
# the maintainer's job: pnpm governance apply --confirm apply-xr-build-governance.
on:
  schedule:
    - cron: '13 3 * * 1'
  push:
    branches: [main]
    paths:
      - config/github-repository-governance.json
      - tools/repo-governance/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: governance-drift

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ vars.XRB_BOT_APP_ID }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set +e
          out=$(node tools/repo-governance/governance.mjs check 2>&1); code=$?
          set -e
          echo "$out"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label governance-drift --state open --json number --jq '.[0].number // empty')
          if [ "$code" -ne 0 ]; then
            body=$(printf '%s\n\n```text\n%s\n```\n\nRestore with `pnpm governance apply --confirm apply-xr-build-governance`, or change the file in a PR.\n\n<sub>Updated by the governance drift workflow: %s</sub>' \
              'The live repository settings differ from `config/github-repository-governance.json`.' "$out" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            if [ -n "$issue" ]; then gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title 'Repository settings drifted from the governance file' --label governance-drift --body "$body"; fi
            exit 1
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment 'The live settings match the governance file again.'
          fi
