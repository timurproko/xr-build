name: OpenSpec finalization

# A ready PR whose body links an OpenSpec change gets the change archived in its own branch (specs synced) by the
# repo's GitHub App, once every task in tasks.md is done; see tools/pr-automation/finalize.mjs. Runs main's copy of
# this workflow and its scripts (pull_request_target); the PR head is only checked out as files for the pinned
# OpenSpec CLI, nothing from it is installed or run.
on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to finalize
        required: true

permissions: {}

concurrency:
  group: openspec-finalization-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  finalize:
    name: Finalize
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, 'openspec-implementation'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
      - id: bot
        uses: ./base/.github/actions/app-token
        with:
          app-id: ${{ vars.XRB_BOT_APP_ID }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
      - id: pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.ref)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned OpenSpec CLI (main's lockfile)
        working-directory: base
        run: pnpm install --frozen-lockfile --filter @xr-build/pr-automation
      - name: Check out the PR branch as the App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.ref }}
          path: head
          token: ${{ steps.bot.outputs.token }}
      - name: Finalize
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          AUTHOR: ${{ steps.bot.outputs.author }}
          PR: ${{ steps.pr.outputs.number }}
        run: node base/tools/pr-automation/finalize.mjs --repo head --pr "$PR" --author "$AUTHOR"
