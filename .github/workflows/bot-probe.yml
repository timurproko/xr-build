name: Bot probe

# Checks the repo's GitHub App: mints a token and reads the repository and its settings with it. With
# `simulate_missing`, runs the guard without the App id to show the message a workflow stops with.
on:
  workflow_dispatch:
    inputs:
      simulate_missing:
        description: Run the guard without XRB_BOT_APP_ID
        type: boolean
        default: false

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ !inputs.simulate_missing && vars.XRB_BOT_APP_ID || '' }}
          private-key: ${{ secrets.XRB_BOT_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          LOGIN: ${{ steps.bot.outputs.login }}
          AUTHOR: ${{ steps.bot.outputs.author }}
        run: |
          echo "bot: $LOGIN ($AUTHOR)"
          gh api "repos/$GITHUB_REPOSITORY" --jq '"repository: \(.full_name), auto-merge \(.allow_auto_merge)"'
          gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" --jq '"workflow permissions: \(.default_workflow_permissions)"'
          gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '"rulesets: \([.[].name] | join(", "))"'
